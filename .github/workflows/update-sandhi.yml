name: Update Sandhi Formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Sandhi release tag to publish (e.g. v0.2.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute SHA-256 for each platform archive
        id: shas
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          mac="sandhi-proxy-${TAG}-aarch64-apple-darwin.tar.gz"
          linux="sandhi-proxy-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/anvai-labs/sandhi/releases/download/${TAG}"
          curl -fsSL "$base/$mac"  -o mac.tgz
          curl -fsSL "$base/$linux" -o linux.tgz
          {
            echo "version=$ver"
            echo "mac_sha=$(sha256sum mac.tgz | cut -d' ' -f1)"
            echo "linux_sha=$(sha256sum linux.tgz | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Rewrite the formula version and checksums
        env:
          TAG: ${{ inputs.tag }}
          MAC_SHA: ${{ steps.shas.outputs.mac_sha }}
          LINUX_SHA: ${{ steps.shas.outputs.linux_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ["TAG"]
          p = pathlib.Path("Formula/sandhi.rb")
          s = p.read_text()
          m = re.search(r"releases/download/(v[^/]+)/", s)
          if not m:
              raise SystemExit("cannot find the current version in Formula/sandhi.rb")
          old_tag = m.group(1)
          if old_tag == tag:
              raise SystemExit(0)
          s = s.replace(f"/{old_tag}/", f"/{tag}/")
          s = re.sub(rf"(sandhi-proxy-){re.escape(old_tag)}", rf"\g<1>{tag}", s)
          shas = iter([os.environ["MAC_SHA"], os.environ["LINUX_SHA"]])
          s, n = re.subn(r'(sha256 ")[0-9a-f]{64}(")', lambda mm: mm.group(1) + next(shas) + mm.group(2), s)
          if n != 2:
              raise SystemExit(f"expected 2 sha256 lines, replaced {n}")
          p.write_text(s)
          PY
          git diff --exit-code && echo "formula already at $TAG" && exit 0 || true

      - name: Commit the bump
        env:
          VERSION: ${{ steps.shas.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "anvai-labs tap bot"
          git config user.email "tap@anvai-labs.local"
          git add Formula/sandhi.rb
          git commit -m "sandhi ${VERSION}"
          # The hardened checkout persists no credentials; push via the job token.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/anvai-labs/homebrew-tap.git" "HEAD:main"
