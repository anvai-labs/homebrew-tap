name: Update Agentbrowser Formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Agentbrowser release tag to publish (e.g. v1.4.1)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute SHA-256 for each platform artifact
        id: shas
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          base="https://github.com/anvai-labs/agentbrowser/releases/download/${TAG}"
          # Order matches the formula's declaration order: the four mcp
          # binaries (sha0-3), then the server tarballs (sha4-7).
          i=0
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            curl -fsSL "$base/agentbrowser-mcp-$target" -o ab.bin
            echo "sha$i=$(sha256sum ab.bin | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            i=$((i+1))
          done
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            curl -fsSL "$base/agentbrowser-server-$target.tar.gz" -o ab.tgz
            echo "sha$i=$(sha256sum ab.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            i=$((i+1))
          done
          # CLI binaries (since v1.8.2); declaration order in the formula:
          # mcp urls (sha0-3), server resource (sha4-7), cli resource
          # (sha8-11: mac-arm, mac-x64, linux-arm, linux-x64).
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            curl -fsSL "$base/agentbrowser-cli-$target" -o ab.cli
            echo "sha$i=$(sha256sum ab.cli | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            i=$((i+1))
          done

      - name: Rewrite the formula version and checksums
        env:
          TAG: ${{ inputs.tag }}
          SHA0: ${{ steps.shas.outputs.sha0 }}
          SHA1: ${{ steps.shas.outputs.sha1 }}
          SHA2: ${{ steps.shas.outputs.sha2 }}
          SHA3: ${{ steps.shas.outputs.sha3 }}
          SHA4: ${{ steps.shas.outputs.sha4 }}
          SHA5: ${{ steps.shas.outputs.sha5 }}
          SHA6: ${{ steps.shas.outputs.sha6 }}
          SHA7: ${{ steps.shas.outputs.sha7 }}
          SHA8: ${{ steps.shas.outputs.sha8 }}
          SHA9: ${{ steps.shas.outputs.sha9 }}
          SHA10: ${{ steps.shas.outputs.sha10 }}
          SHA11: ${{ steps.shas.outputs.sha11 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ["TAG"]
          p = pathlib.Path("Formula/agentbrowser.rb")
          s = p.read_text()
          m = re.search(r"releases/download/(v[^/]+)/", s)
          if not m:
              raise SystemExit("cannot find the current version in Formula/agentbrowser.rb")
          old_tag = m.group(1)
          if old_tag == tag:
              raise SystemExit(0)
          s = s.replace(f"/{old_tag}/", f"/{tag}/")
          # Declaration order: mcp binaries (sha0-3), the server resource
          # (sha4-7), then the cli resource (sha8-11) added in v1.8.2.
          shas = iter([os.environ[f"SHA{i}"] for i in range(12)])
          s, n = re.subn(r'(sha256 ")[0-9a-f]{64}(")', lambda mm: mm.group(1) + next(shas) + mm.group(2), s)
          if n != 12:
              raise SystemExit(f"expected 12 sha256 lines, replaced {n}")
          p.write_text(s)
          PY
          git diff --exit-code && echo "formula already at $TAG" && exit 0 || true


      - name: Open or update the bump pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/update-agentbrowser-formula
          delete-branch: true
          commit-message: "agentbrowser ${{ inputs.tag }}"
          title: "agentbrowser ${{ inputs.tag }}"
          body: "Automated bump: release assets downloaded, SHA-256s recomputed from the actual bytes."
