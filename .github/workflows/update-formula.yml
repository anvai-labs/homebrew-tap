name: Update Formula

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact PyPI version; defaults to latest
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release metadata from PyPI
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with urllib.request.urlopen("https://pypi.org/pypi/victor-ai/json", timeout=20) as response:
              project = json.load(response)
          version = os.environ.get("REQUESTED_VERSION") or project["info"]["version"]
          files = project["releases"].get(version, [])
          sdist = next((item for item in files if item["packagetype"] == "sdist"), None)
          if not sdist:
              raise SystemExit(f"No sdist found on PyPI for victor-ai {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"url={sdist['url']}\n")
              output.write(f"sha256={sdist['digests']['sha256']}\n")
          PY

      - name: Update formula fields
        env:
          SDIST_URL: ${{ steps.release.outputs.url }}
          SDIST_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/victor.rb")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'^  homepage ".*"$', '  homepage "https://github.com/anvai-labs/victor"', text, flags=re.MULTILINE)
          text = re.sub(r'^  url ".*"$', f'  url "{os.environ["SDIST_URL"]}"', text, flags=re.MULTILINE)
          text = re.sub(r'^  sha256 ".*"$', f'  sha256 "{os.environ["SDIST_SHA256"]}"', text, flags=re.MULTILINE)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate generated formula
        run: python -m unittest discover -s tests -v

      - name: Open or update formula pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/update-victor-formula
          delete-branch: true
          commit-message: 'chore: update Victor formula to ${{ steps.release.outputs.version }}'
          title: 'chore: update Victor formula to ${{ steps.release.outputs.version }}'
          body: Automated PyPI release metadata and digest update. CI validates the downloaded archive before merge.
