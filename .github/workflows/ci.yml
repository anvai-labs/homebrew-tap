name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

jobs:
  authorize-owner-private:
    name: Authorize owner private CI
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor_id == '5168752' &&
      github.event.pull_request.user.id == 5168752 &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: owner-private-ci
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - run: test "${RUNNER_ENVIRONMENT}" = "self-hosted"

  validate:
    name: Formula validation
    needs: authorize-owner-private
    if: >-
      always() && (
        github.event_name != 'pull_request_target' ||
        github.actor_id != '5168752' ||
        github.event.pull_request.user.id != 5168752 ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        needs.authorize-owner-private.result == 'success'
      )
    runs-on: ${{ github.event_name == 'pull_request_target' && github.actor_id == '5168752' && github.event.pull_request.user.id == 5168752 && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_REF }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
      - name: Check Ruby syntax
        run: ruby -c Formula/victor.rb
      - name: Run formula release-contract tests
        run: python -m unittest discover -s tests -v

  ci-success:
    name: CI Success
    needs: [authorize-owner-private, validate]
    if: >-
      always() && (
        github.event_name != 'pull_request_target' ||
        github.actor_id != '5168752' ||
        github.event.pull_request.user.id != 5168752 ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        needs.authorize-owner-private.result == 'success'
      )
    runs-on: ${{ github.event_name == 'pull_request_target' && github.actor_id == '5168752' && github.event.pull_request.user.id == 5168752 && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "${VALIDATION_RESULT}" = "success"
