name: CI

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

jobs:
  authorize-owner-private:
    name: Authorize owner private CI
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor_id == '5168752' &&
      github.event.pull_request.user.id == 5168752 &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: owner-private-ci
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - run: test "${RUNNER_ENVIRONMENT}" = "self-hosted"

  validate:
    name: Formula validation
    needs: authorize-owner-private
    if: >-
      always() && (
        github.event_name != 'pull_request_target' ||
        github.actor_id != '5168752' ||
        github.event.pull_request.user.id != 5168752 ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        needs.authorize-owner-private.result == 'success'
      )
    runs-on: ${{ github.event_name == 'pull_request_target' && github.actor_id == '5168752' && github.event.pull_request.user.id == 5168752 && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_REF }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install Ruby when absent
        run: |
          if ! command -v ruby >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes ruby
            else
              apt-get update
              apt-get install --yes ruby
            fi
          fi
          ruby --version
      - name: Check Ruby syntax of every formula
        run: for f in Formula/*.rb; do ruby -c "$f"; done
      - name: Run formula release-contract tests
        run: python -m unittest discover -s tests -v

  formulas:
    name: Brew audit + install tests
    needs: validate
    if: >-
      always() && (
        github.event_name != 'pull_request_target' ||
        github.actor_id != '5168752' ||
        github.event.pull_request.user.id != 5168752 ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        needs.validate.result == 'success'
      )
    runs-on: ${{ github.event_name == 'pull_request_target' && github.actor_id == '5168752' && github.event.pull_request.user.id == 5168752 && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_REF }}
          persist-credentials: false
          clean: true
      # Bootstraps Homebrew on the Linux runner (no stored token needed; the
      # tap's installables are public release artifacts and PyPI sdists).
      - uses: Homebrew/actions/setup-homebrew@23156a3d9674d7f52f74f1a58979ec4d77847166
      - name: Tap the checked-out formulas
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/anvai-labs/homebrew-tap"
          rm -rf "$TAP_DIR" || sudo rm -rf "$TAP_DIR"
          mkdir -p "$(dirname "$TAP_DIR")"
          git clone "$GITHUB_WORKSPACE" "$TAP_DIR"
          git -C "$TAP_DIR" checkout -q "${{ env.CI_REF }}"
      - name: Audit every formula
        run: |
          brew audit --formula \
            anvai-labs/tap/sandhi \
            anvai-labs/tap/sentinelpass \
            anvai-labs/tap/victor
      - name: Install every formula from the tap
        run: |
          brew install anvai-labs/tap/sandhi anvai-labs/tap/sentinelpass anvai-labs/tap/victor
      - name: Run every formula test block
        run: |
          brew test anvai-labs/tap/sandhi anvai-labs/tap/sentinelpass anvai-labs/tap/victor

  ci-success:
    name: CI Success
    needs: [authorize-owner-private, validate, formulas]
    if: >-
      always() && (
        github.event_name != 'pull_request_target' ||
        github.actor_id != '5168752' ||
        github.event.pull_request.user.id != 5168752 ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        needs.authorize-owner-private.result == 'success'
      )
    runs-on: ${{ github.event_name == 'pull_request_target' && github.actor_id == '5168752' && github.event.pull_request.user.id == 5168752 && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          FORMULAS_RESULT: ${{ needs.formulas.result }}
        run: |
          test "${VALIDATION_RESULT}" = "success"
          test "${FORMULAS_RESULT}" = "success"
