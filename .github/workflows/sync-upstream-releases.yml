name: Check upstream releases

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sync-upstream-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Queue updates for newer stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-upstream-releases.py --dispatch
