name: Update SentinelPass Formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SentinelPass release tag to publish (e.g. v0.9.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-sentinelpass
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute SHA-256 for each release asset
        id: shas
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          base="https://github.com/anvai-labs/sentinelpass/releases/download/${TAG}"
          # Download into RUNNER_TEMP, never the repo root: the checked-out
          # tree must stay clean so create-pull-request only ever sees the
          # formula/cask edits.
          dir="${RUNNER_TEMP}/sentinelpass-assets"
          mkdir -p "$dir"
          mac="sentinelpass-${ver}-macos.tar.gz"
          linux="sentinelpass-${ver}-linux.tar.gz"
          dmg="sentinelpass-${ver}-macos.dmg"
          # Formula and desktop cask are one release unit. Missing assets or
          # transient download failures must not publish a partial bump.
          curl -fsSL "$base/$mac" -o "$dir/$mac"
          curl -fsSL "$base/$linux" -o "$dir/$linux"
          curl -fsSL "$base/$dmg" -o "$dir/$dmg"
          curl -fsSL "$base/sha256sums.txt" -o "$dir/sha256sums.txt"
          for asset in "$mac" "$linux" "$dmg"; do
            actual="$(sha256sum "$dir/$asset" | cut -d' ' -f1)"
            expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset {print $1}' "$dir/sha256sums.txt")"
            test "$actual" = "$expected" || { echo "::error::Checksum mismatch for $asset"; exit 1; }
          done
          {
            echo "version=$ver"
            echo "mac_sha=$(sha256sum "$dir/$mac" | cut -d' ' -f1)"
            echo "linux_sha=$(sha256sum "$dir/$linux" | cut -d' ' -f1)"
            echo "dmg_sha=$(sha256sum "$dir/$dmg" | cut -d' ' -f1)"
            echo "has_dmg=true"
          } >> "$GITHUB_OUTPUT"

      - name: Rewrite the formula and cask versions and checksums
        id: rewrite
        env:
          TAG: ${{ inputs.tag }}
          MAC_SHA: ${{ steps.shas.outputs.mac_sha }}
          LINUX_SHA: ${{ steps.shas.outputs.linux_sha }}
          DMG_SHA: ${{ steps.shas.outputs.dmg_sha }}
          HAS_DMG: ${{ steps.shas.outputs.has_dmg }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re

          tag = os.environ["TAG"]
          ver = tag[1:] if tag.startswith("v") else tag

          def bump_formula(path, shas):
              """Formula: literal versions (tap convention — brew detects the
              version from the URL). Rewrite URL tag path, asset filenames and
              the two plain sha256 lines (mac first, linux second, n=2)."""
              s = path.read_text()
              m = re.search(r"releases/download/(v[^/]+)/", s)
              if not m:
                  raise SystemExit(f"cannot find the current version in {path}")
              old_tag = m.group(1)
              old_ver = old_tag[1:] if old_tag.startswith("v") else old_tag
              if old_tag == tag:
                  return False
              # URL paths carry the v-prefixed tag; asset names the bare version.
              s = s.replace(f"/{old_tag}/", f"/{tag}/")
              s = re.sub(rf"(sentinelpass-){re.escape(old_ver)}", rf"\g<1>{ver}", s)
              it = iter(shas)
              s, n = re.subn(
                  r'(sha256\s*")[0-9a-f]{64}(")',
                  lambda mm: mm.group(1) + next(it) + mm.group(2),
                  s,
              )
              if n != 2:
                  raise SystemExit(f"{path}: expected 2 sha256 lines, replaced {n}")
              path.write_text(s)
              return True

          def bump_cask(path, sha):
              """Cask: URL is fully version-templated (cask audit requires a
              versioned URL and rejects a literal one as unversioned), so the
              version stanza is the only version string in the file. Rewrite
              stanza + the single `sha256 arm:` line; nothing else moves."""
              s = path.read_text()
              m = re.search(r'^(\s*version ")([^"]+)(")', s, re.MULTILINE)
              if not m:
                  raise SystemExit(f"cannot find the version stanza in {path}")
              old_ver = m.group(2)
              if old_ver == ver:
                  return False
              s = s[:m.start()] + m.group(1) + ver + m.group(3) + s[m.end():]
              s, n = re.subn(
                  r'(sha256\s+arm:\s*")[0-9a-f]{64}(")',
                  lambda mm: mm.group(1) + sha + mm.group(2),
                  s,
              )
              if n != 1:
                  raise SystemExit(f"{path}: expected 1 sha256 line, replaced {n}")
              path.write_text(s)
              return True

          changed_formula = bump_formula(
              pathlib.Path("Formula/sentinelpass.rb"),
              [os.environ["MAC_SHA"], os.environ["LINUX_SHA"]],
          )
          changed_cask = False
          if os.environ["HAS_DMG"] == "true":
              changed_cask = bump_cask(
                  pathlib.Path("Casks/sentinelpass.rb"),
                  os.environ["DMG_SHA"],
              )
          if not (changed_formula or changed_cask):
              print(f"formula and cask already at {tag}")
          PY
          # Either file changing (a partial previous run converges here) is
          # enough to open the PR; downloaded assets live in RUNNER_TEMP and
          # never leak into the diff.
          if git diff --quiet -- Formula/sentinelpass.rb Casks/sentinelpass.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the bump pull request
        if: steps.rewrite.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/update-sentinelpass-formula
          delete-branch: true
          commit-message: "sentinelpass ${{ steps.shas.outputs.version }}"
          title: "sentinelpass ${{ steps.shas.outputs.version }}"
          body: "Automated bump: release assets downloaded to RUNNER_TEMP, SHA-256s recomputed from the actual bytes and cross-checked against the release sha256sums.txt."
          add-paths: |
            Formula/sentinelpass.rb
            Casks/sentinelpass.rb

      - name: Run CI on the updated PR branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref automation/update-sentinelpass-formula
